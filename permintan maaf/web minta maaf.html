
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffe4ee">
    <title>Untuk Zahraaa 💌</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="hearts" aria-hidden="true">
        <span>♡</span>
        <span>♥</span>
        <span>♡</span>
        <span>♥</span>
        <span>♡</span>
        <span>♥</span>
    </div>

    <main class="container">
        <div class="top-heart">♡</div>

        <p class="small-title">A LITTLE LETTER FOR YOU</p>

        <h1>Hai, Zahraaa <span>♡</span></h1>

        <p class="subtitle">
            Ada sesuatu yang ingin aku sampaikan...
        </p>

        <p class="instruction" id="instruction">
            Ketuk amplopnya untuk membuka surat 💌
        </p>

        <button
            class="envelope-button"
            id="envelopeButton"
            type="button"
            aria-label="Buka amplop surat"
            aria-expanded="false"
        >
            <div class="envelope" id="envelope">
                <div class="letter-preview">
                    <span>Untuk Zahraaa</span>
                    <span class="preview-heart">♥</span>
                </div>

                <div class="envelope-back"></div>
                <div class="envelope-left"></div>
                <div class="envelope-right"></div>
                <div class="envelope-front"></div>

                <div class="envelope-flap"></div>

                <div class="seal">♥</div>
            </div>
        </button>

        <p class="envelope-caption">Maaf yaa </p>

        <section
            class="letter-content"
            id="letterContent"
            aria-hidden="true"
            inert
        >
            <div class="letter-paper">
                <div class="letter-decoration">🌷</div>

                <p class="letter-greeting">Untuk Zahraa</p>

                <h2>Jangan marah lagi yaa 🥺</h2>

                <p class="highlight">
                    Zahraaa, jangan marah lagi yaa.
                    Maafin aku yaa.

                <div class="letter-actions">
                    <button id="forgiveButton" type="button">
                        Aku sudah baca 🤍
                    </button>

                    <button id="closeLetterButton"
                            class="secondary-button"
                            type="button">
                        Tutup surat
                    </button>
                </div>

                <p class="response" id="response" role="status"
                   aria-live="polite"></p>
            </div>
        </section>

        <footer>
            <p>Semoga hatimu kembali tenang, Zahraaa ♡</p>
            <span>♡ &nbsp; ♡ &nbsp; ♡</span>
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
